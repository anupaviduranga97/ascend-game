<style>
*{box-sizing:border-box}body{margin:0;background:#07090d;color:#edf2f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{max-width:980px;margin:auto;min-height:100vh;background:#0b0f15}
header{position:sticky;top:0;z-index:5;background:rgba(9,12,17,.96);backdrop-filter:blur(12px);border-bottom:1px solid #222c39;padding:15px}
.brand{font-weight:900;letter-spacing:2px;font-size:22px}.tagline{font-size:9px;color:#7f8b9c;letter-spacing:1.3px;margin-top:2px}.resources{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}.res{background:#151c26;border:1px solid #242f3d;padding:6px 8px;border-radius:8px;font-size:11px}

main{padding:14px}.card{background:#111720;border:1px solid #26313f;border-radius:15px;padding:14px;margin-bottom:12px}.hero{background:radial-gradient(circle at 70% 20%,#283b50,#111720 55%,#0b0f15);border-radius:18px;padding:25px 16px;text-align:center;border:1px solid #334154;margin-bottom:12px}
h1,h2,h3{margin:5px 0 10px}h1{font-size:28px}h2{font-size:19px}h3{font-size:14px}.muted{color:#8793a4;font-size:12px}.tiny{font-size:10px;color:#758295}.btn{width:100%;border:0;border-radius:10px;padding:12px;margin-top:8px;background:#e9eef3;color:#07090c;font-weight:900}.btn.alt{background:#202a36;color:#fff}.btn.warn{background:#3a2720;color:#fff}.btn:disabled{opacity:.35}

.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #202934;font-size:12px}.stat:last-child{border:0}.bar{height:6px;background:#252f3c;border-radius:9px;overflow:hidden;margin-top:4px}.fill{height:100%;background:#dfe6ed}
.war{border:1px solid #2a3543;border-radius:13px;padding:12px;margin-bottom:9px;background:#0e141c}.war.sel{border-color:#eef3f7;box-shadow:0 0 0 1px #eef3f7 inset}
.badge{display:inline-block;background:#222c39;border-radius:6px;padding:4px 6px;font-size:9px;margin:2px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.avatar{font-size:42px}.origin{font-weight:900;letter-spacing:.6px}.input{width:100%;background:#080b10;border:1px solid #3a4655;color:#fff;padding:12px;border-radius:10px;margin-top:8px}.select{width:100%;background:#080b10;color:#fff;border:1px solid #344050;border-radius:9px;padding:11px}
.log{height:180px;overflow:auto;background:#080b10;border:1px solid #222c37;border-radius:10px;padding:9px;font-size:11px;line-height:1.55}.enemy{color:#ffb1a6}.good{color:#a9e6b5}.gold{color:#f1d48c}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#eef2f5;color:#080a0d;padding:10px 14px;border-radius:10px;font-weight:800;font-size:12px;z-index:20;display:none;max-width:90%;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:15;display:none;align-items:flex-end}.modalBox{width:100%;max-width:980px;margin:auto;background:#10161f;border:1px solid #303b4a;border-radius:20px 20px 0 0;padding:17px;max-height:88vh;overflow:auto}
.progress{height:9px;background:#252f3b;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#e6ebf0}
.empty{text-align:center;padding:30px 12px;color:#778496}.danger{color:#ff9e91}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}nav button{font-size:11px}.modal{align-items:center}.modalBox{border-radius:18px}}

/* ===== ASCEND CONTINUOUS TEST BUILD ===== */
.test-card{background:#0b121a;border:1px solid #334454;border-radius:14px;padding:13px;margin:10px 0}
.test-title{font-size:18px;font-weight:900;margin-bottom:5px}.test-muted{color:#9eabb7;font-size:12px}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.test-grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.test-stat{padding:8px;border:1px solid #263746;border-radius:9px;background:#101923}.test-stat b{display:block;font-size:16px}.test-stat span{font-size:9px;color:#91a0ad}
.test-war{padding:10px;border:1px solid #304252;border-radius:10px;margin:7px 0}.test-war.sel{border-color:#d9e2e8;background:#15212c}
.test-war button{margin-top:7px}.test-report{background:#080e14;border:1px solid #334454;border-radius:12px;padding:12px;margin-top:10px}
.test-win{font-size:22px;font-weight:900}.test-loss{font-size:22px;font-weight:900}
.test-round{padding:8px 0;border-bottom:1px solid #1f2b36;font-size:11px;line-height:1.45}.test-round:last-child{border-bottom:0}
.test-reason{padding:9px;border-left:3px solid #aab7c1;background:#111b24;margin:5px 0;font-size:11px}
.test-code{font-family:monospace;word-break:break-all;background:#060a0e;border:1px solid #334454;border-radius:8px;padding:10px;font-size:11px}
.test-character{background:radial-gradient(circle at 50% 42%,#315268,#0a1118 63%);height:250px;border-radius:12px;position:relative;overflow:hidden;margin:8px 0}
.test-body{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:108px;height:175px}
.test-head{position:absolute;left:30px;top:0;width:48px;height:48px;border-radius:45%;background:linear-gradient(145deg,#e8eef2,#566976 60%,#151e26);border:2px solid #d3dfe5}
.test-eye{position:absolute;left:36px;top:20px;width:36px;height:7px;border-radius:5px;background:var(--core);box-shadow:0 0 14px var(--core);z-index:3}
.test-torso{position:absolute;left:11px;top:50px;width:86px;height:92px;background:linear-gradient(145deg,#c7d2da,#526673 45%,#111a22);clip-path:polygon(18% 0,82% 0,100% 25%,84% 100%,16% 100%,0 25%);border:2px solid #aebcc5}
.test-core{position:absolute;left:39px;top:71px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--core) 32%,#235a78 63%,transparent 66%);box-shadow:0 0 24px var(--core);z-index:4}
.test-arm{position:absolute;top:56px;width:25px;height:85px;border-radius:14px;background:linear-gradient(#738795,#1c2730);border:2px solid #9daeb9}.test-arm.l{left:-5px;transform:rotate(8deg)}.test-arm.r{right:-5px;transform:rotate(-8deg)}
.test-leg{position:absolute;top:136px;width:30px;height:39px;border-radius:8px;background:#1a252e;border:2px solid #81929e}.test-leg.l{left:23px}.test-leg.r{right:23px}
.test-weapon{position:absolute;right:0;top:60px;width:8px;height:100px;background:linear-gradient(#fff,var(--core));box-shadow:0 0 13px var(--core);transform:rotate(22deg);z-index:5}
.test-equip{position:absolute;left:9px;top:48px;width:90px;height:105px;border:4px solid #d5e0e6;border-radius:25px;opacity:.28}
@media(max-width:420px){.test-grid3{grid-template-columns:1fr 1fr}.test-character{height:230px}}


.compact-warrior{position:relative;cursor:pointer;padding:10px;margin-bottom:8px;border:1px solid #263443;border-radius:13px;background:#0d131b}.compact-warrior:active{border-color:#e8edf2}.compact-head{display:flex;align-items:center;gap:10px}.compact-avatar{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#151e29;border:1px solid #304052;flex:0 0 52px}.compact-main{min-width:0;flex:1}.compact-name{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.compact-meta{font-size:10px;color:#8290a1;margin-top:3px}.compact-power{font-size:11px;font-weight:900;text-align:right}.compact-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:9px}.compact-stat{background:#111923;border:1px solid #202d3b;border-radius:7px;padding:5px 4px;text-align:center}.compact-stat span{display:block;font-size:7px;color:#778597}.compact-stat b{display:block;font-size:11px;margin-top:2px}.compact-footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.compact-chip{font-size:9px;color:#aab6c5;background:#18222e;border-radius:6px;padding:4px 6px}.compact-arrow{font-size:18px;color:#8795a6}.warrior-modal-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.warrior-modal-stat{background:#101821;border:1px solid #263544;border-radius:9px;padding:9px}.warrior-modal-stat span{display:block;font-size:9px;color:#8290a1}.warrior-modal-stat b{font-size:17px}.history-scroll{max-height:260px;overflow:auto;border:1px solid #25303d;border-radius:9px;padding:8px;background:#090d12}.history-row{padding:7px 2px;border-bottom:1px solid #1d2732;font-size:10px;color:#a7b2c0}.history-row:last-child{border-bottom:0}

/* ===== ASCEND FULL GAMEPLAY V7 ===== */
.slot-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.slot{background:#0b1118;border:1px solid #293746;border-radius:9px;padding:8px}.slot b{display:block;font-size:11px}.slot span{font-size:9px;color:#8795a5}.item-mini{background:#101923;border:1px solid #273645;border-radius:9px;padding:9px;margin:6px 0}.recipe{background:#0d141c;border:1px solid #2b3948;border-radius:11px;padding:10px;margin:7px 0}.recipe .cost{font-size:10px;color:#91a0af}.stage-pill{display:inline-block;padding:5px 8px;border-radius:7px;background:#202c39;font-size:9px;font-weight:800}.task{background:#0d141c;border:1px solid #293847;border-radius:10px;padding:10px;margin:7px 0}.task.done{opacity:.6}.dev-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}.dev-tabs button{background:#17212c;border:1px solid #293847;color:#dfe6ed;border-radius:8px;padding:9px 4px;font-size:10px;font-weight:800}.dev-tabs button.active{background:#e9eef3;color:#07090d}
</style>

<body>
<div class="app">
<header>
 <div class="brand">ASCEND</div><div class="tagline">WARRIORS OF THE CORE · BUILD. EVOLVE. MASTER. TRADE. ASCEND.</div>
 <div id="resources" class="resources"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="modal" class="modal"><div class="modalBox" id="modalBox"></div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";
const ORIGINS=[
{name:"ELEMENTO",trait:"Adaptive / Balanced",icon:"◇",base:[100,50,50,50,50,50,50,70]},
{name:"PYRION",trait:"Energy / Force",icon:"🔥",base:[95,65,42,48,52,70,48,55]},
{name:"AQUION",trait:"Recovery / Control",icon:"💧",base:[105,42,55,45,55,65,65,72]},
{name:"TERRON",trait:"Durability",icon:"◆",base:[115,58,75,32,40,42,62,45]},
{name:"VYRON",trait:"Velocity",icon:"⚡",base:[90,45,40,78,62,50,45,55]},
{name:"UMBRA",trait:"Stealth",icon:"◐",base:[88,48,42,68,78,48,45,68]},
{name:"AERIX",trait:"Mobility / Precision",icon:"△",base:[92,46,44,72,75,52,48,62]},
{name:"VOLTRIX",trait:"Core Energy",icon:"✦",base:[94,55,45,55,58,82,45,58]},
{name:"MECHRON",trait:"Equipment Synergy",icon:"▣",base:[100,58,62,45,52,62,50,52]},
{name:"NEXARA",trait:"Adaptation",icon:"◎",base:[98,50,50,52,55,60,55,85]}
];
const STATN=["Vitality","Force","Guard","Velocity","Precision","Core Energy","Recovery","Adaptation"];
const GEAR=[
["VOIDBLADE","Weapon"],["TITAN HAMMER","Weapon"],["AETHER SPEAR","Weapon"],["VOLT ARC","Weapon"],["GRAVITY MAUL","Weapon"],
["TITANFRAME","Armour"],["AEROSHELL","Armour"],["VOIDWEAVE","Armour"],["COREPLATE","Armour"],["AEGIS PRIME","Armour"],
["NEURAL LINK","Augment"],["ADRENAL CORE","Augment"],["REGEN MATRIX","Augment"],["PHASE CHIP","Augment"],["CORE AMPLIFIER","Augment"]
];
const ABILITIES=[
["CORE STRIKE","Force","A direct Core-powered strike."],["CORE BREAKER","Force","High impact against guarded targets."],
["PHASE STRIKE","Velocity","A rapid strike that gains initiative."],["INFERNO DASH","Velocity","Movement becomes an attack."],
["VOID EXECUTION","Precision","Powerful against exposed targets."],["AEGIS OVERDRIVE","Guard","Converts defence into pressure."],
["REGEN SURGE","Recovery","Restores team condition."],["CORE NOVA","Core Energy","High energy burst with resource cost."],
["ADAPTIVE SHIFT","Adaptation","Changes tactical advantage."],["GRAVITY LOCK","Guard","Reduces enemy mobility."],
["NEURAL OVERCLOCK","Precision","Improves critical opportunity."],["PHASE WALL","Guard","Reduces incoming damage."]
];
const RARITIES=["Common","Uncommon","Rare","Epic","Legendary","Mythic","Apex"];
const RANKS=["UNRANKED","BRONZE","SILVER","GOLD","PLATINUM","DIAMOND","ASCENDANT","APEX"];
const fresh={
 day:1,credits:100,fragments:3,parts:3,shards:0,prime:0,overcore:0,
 drops:3,timed:3,training:6,scavenge:5,practice:5,ranked:3,
 chars:[],inventory:[],history:[],missions:{done:false},rank:0,rating:0,
 team:[],screen:"home",selected:null,battle:null,created:Date.now(),market:[],battleHistory:[],friendTeams:[],testSelected:{a:null,b:null},testMode:"1v1",dropHistory:[]
};
let S=load();
const SAVE_KEY="ASCEND_SAVE";
const DB_NAME="ASCEND_CORE_DB";
const DB_STORE="saves";
function load(){try{const raw=localStorage.getItem(SAVE_KEY);return Object.assign({},fresh,raw?JSON.parse(raw):{});}catch(e){return {...fresh}}}
function save(){
  try{S._saveAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}
  try{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE,{keyPath:"key"});};req.onsuccess=function(){try{const db=req.result,tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put({key:SAVE_KEY,at:S._saveAt||Date.now(),data:JSON.stringify(S)});tx.oncomplete=function(){db.close()};}catch(e){}};}catch(e){}
}
async function restorePersistentSave(){
  let best=S,bestAt=Number(S._saveAt||0);
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const x=JSON.parse(raw),at=Number(x._saveAt||0);if(at>=bestAt){best=Object.assign({},fresh,x);bestAt=at;}}}catch(e){}
  try{const rec=await new Promise(function(resolve){let done=false;function finish(v){if(!done){done=true;resolve(v)}}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=function(){if(!req.result.objectStoreNames.contains(DB_STORE))req.result.createObjectStore(DB_STORE,{keyPath:"key"});};req.onsuccess=function(){try{const db=req.result,tx=db.transaction(DB_STORE,"readonly"),g=tx.objectStore(DB_STORE).get(SAVE_KEY);g.onsuccess=function(){finish(g.result||null)};g.onerror=function(){finish(null)};tx.oncomplete=function(){db.close()};}catch(e){finish(null)}};req.onerror=function(){finish(null)};setTimeout(function(){finish(null)},1200);});if(rec&&Number(rec.at||0)>bestAt){const x=JSON.parse(rec.data);best=Object.assign({},fresh,x);}}catch(e){}
  S=best;ensureFullGame();render();
}

function uid(origin){return origin.slice(0,3)+"-"+String(S.chars.length+1).padStart(6,"0")}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rarity(){let r=Math.random();return r<.43?"Common":r<.68?"Uncommon":r<.84?"Rare":r<.93?"Epic":r<.975?"Legendary":r<.995?"Mythic":"Apex"}
function power(c){return Math.round((c.stats.reduce((a,b)=>a+b,0)/8)+c.level*7+c.gear.length*4)}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",1700)}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function log(h){S.history.unshift("Day "+S.day+" — "+h);S.history=S.history.slice(0,300)}
function createWarrior(o,name){
 let stats=o.base.map((v,i)=>v+rnd(-2,2));
 let c={id:uid(o.name),origin:o.name,trait:o.trait,icon:o.icon,name:name,stats,level:1,xp:0,condition:100,energy:100,abilities:["CORE STRIKE"],gear:[],createdDay:S.day,battles:0,wins:0,losses:0,history:["Created on Day "+S.day],value:100};
 S.chars.push(c);log("Created "+o.name+" "+name+" ["+c.id+"]");save();return c;
}
function render(){
 document.getElementById("resources").innerHTML=[
 ["◈",S.credits],["◇",S.fragments],["⚙",S.parts],["✦",S.shards],["◆",S.prime],["⬢",S.overcore],["DAY",S.day]
 ].map(x=>`<span class="res">${x[0]} ${x[1]}</span>`).join("");
 const tabs=[["home","HOME"],["warriors","WARRIORS"],["actions","ACTIONS"],["inventory","INVENTORY"],["battle","ARENA"],["market","MARKET"],["history","CHRONICLE"]];
 document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="${S.screen===t[0]?"active":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");
 document.getElementById("main").innerHTML=screen();
}
function go(x){S.screen=x;render();save()}
function screen(){switch(S.screen){case"warriors":return warriors();case"actions":return actions();case"inventory":return inventory();case"battle":return arena();case"market":return market();case"history":return history();default:return home()}}
function home(){
 return `<section class="hero"><div class="avatar">✦</div><h1>CORE SYSTEM ONLINE</h1><p class="muted">Build Warriors. Develop them. Master the Core. Your progress persists on this device.</p>
 <button class="btn" onclick="openDrop('daily')" ${S.drops<1?"disabled":""}>OPEN CORE DROP · ${S.drops}/3</button>
 <button class="btn alt" onclick="openDrop('timed')" ${S.timed<1?"disabled":""}>TIMED SUPPLY DROP · ${S.timed}/3</button><p class="tiny" style="margin-top:12px">Drop tables contain resources, materials, equipment, ability cores and occasional Warrior Cores. Opening a drop does not guarantee a Warrior.</p></section>
 <div class="grid">${[
 ["WARRIORS",S.chars.length],["AVG POWER",S.chars.length?Math.round(S.chars.reduce((a,c)=>a+power(c),0)/S.chars.length):0],
 ["RANK",RANKS[S.rank]],["RATING",S.rating],["TRAINING",S.training+"/6"],["SCAVENGE",S.scavenge+"/5"]
 ].map(x=>`<div class="card"><div class="muted">${x[0]}</div><h2>${x[1]}</h2></div>`).join("")}</div>
 <div class="card"><h2>DAILY CORE LOOP</h2><div class="stat"><span>Core Drops</span><b>3/day</b></div><div class="stat"><span>Timed Supply Drops</span><b>3/day</b></div><div class="stat"><span>Training</span><b>6/day</b></div><div class="stat"><span>Scavenge</span><b>5/day</b></div><div class="stat"><span>Practice Battles</span><b>5/day</b></div><div class="stat"><span>Ranked Battles</span><b>3/day</b></div></div>
 ${S.chars.length?`<div class="card"><h2>ACTIVE WARRIOR</h2>${miniWarrior(S.chars[S.chars.length-1])}</div>`:""}`;
}
function miniWarrior(c){return `<div class="row"><div><div class="avatar">${c.icon}</div></div><div style="flex:1"><div class="origin">${esc(c.origin)} ${esc(c.name)}</div><span class="badge">${c.id}</span><span class="badge">LV ${c.level}</span><span class="badge">POWER ${power(c)}</span><div class="progress"><div style="width:${c.condition}%"></div></div><div class="tiny">Condition ${c.condition}% · Energy ${c.energy}%</div></div></div>`}
function dropTable(kind){
 return kind==="daily"?[
  ["resources",34],["materials",22],["equipment",20],["ability",10],["warrior",8],["rare",6]
 ]:[
  ["equipment",34],["resources",20],["materials",18],["ability",14],["warrior",9],["rare",5]
 ];
}
function chooseDropType(kind){
 let roll=Math.random()*100,acc=0;
 for(const x of dropTable(kind)){acc+=x[1];if(roll<acc)return x[0]}
 return "resources";
}
function makeEquipment(){
 let base=GEAR[rnd(0,GEAR.length-1)],r=rarity(),mult=RARITIES.indexOf(r)+1;
 let g={id:"ITM-"+Date.now().toString(36).toUpperCase()+"-"+rnd(100,999),name:base[0],type:base[1],rarity:r,condition:100,bonus:rnd(2,6)*mult,sell:Math.max(3,Math.round(mult*7)),source:"Drop"};
 S.inventory.push(g);return g;
}
function generateDropReward(kind){
 let type=chooseDropType(kind);
 if(type==="warrior"){
  let o=ORIGINS[rnd(0,ORIGINS.length-1)];
  return {type:"warrior",origin:o,name:o.name,trait:o.trait,icon:o.icon};
 }
 if(type==="equipment"){let g=makeEquipment();return {type:"equipment",item:g};}
 if(type==="ability"){
  let pool=ABILITIES.filter(a=>!S.chars.some(c=>c.abilities.includes(a[0])));
  let a=pool.length?pool[rnd(0,pool.length-1)]:ABILITIES[rnd(0,ABILITIES.length-1)];
  let core={id:"ABL-"+Date.now().toString(36).toUpperCase()+"-"+rnd(100,999),name:a[0],description:a[1],affinity:a[2],type:"Ability Core"};
  S.inventory.push(core);return {type:"ability",item:core};
 }
 if(type==="materials"){
  let rewards=[];

function battleAction(action){

 if(action==="ITEM")dmg+=5;
 if(action==="TACTICAL"&&Math.random()<.55)dmg+=Math.round(velocity/10);
 b.enemyHp=Math.max(0,b.enemyHp-dmg);b.log.push("Turn "+b.turn+": "+action+" dealt "+dmg+(crit?" CRITICAL":"")+" damage.");
 if(b.enemyHp<=0){finishBattle(true);return}
 let guard=action==="DEFEND"?.45:action==="TACTICAL"?.8:1;
 let incoming=Math.max(2,Math.round((b.enemyPower/15)*(.65+Math.random()*.6)*guard));

 team.forEach(c=>{c.condition=Math.max(0,c.condition-Math.max(1,Math.round(incoming/team.length)));c.energy=Math.max(0,c.energy-rnd(2,6));c.battles++});
 b.turn++;save();render();
}

function testMatch(a,b){
  var A=JSON.parse(JSON.stringify(a)),B=JSON.parse(JSON.stringify(b));
  var log=[],scoreA=0,scoreB=0, hpA=100,hpB=100, rounds=0;
  var factors={A:{force:A.stats[1],guard:A.stats[2],velocity:A.stats[3],precision:A.stats[4],core:A.stats[5],recovery:A.stats[6],adaptation:A.stats[7]},B:{force:B.stats[1],guard:B.stats[2],velocity:B.stats[3],precision:B.stats[4],core:B.stats[5],recovery:B.stats[6],adaptation:B.stats[7]}};
  var pA=testPower(A),pB=testPower(B);
  while(hpA>0&&hpB>0&&rounds<12){
    rounds++;
    var first=factors.A.velocity>=factors.B.velocity?"A":"B";
    var order=first==="A"?["A","B"]:["B","A"];
    order.forEach(function(x){
      if(hpA<=0||hpB<=0)return;
      var atk=x==="A"?A:B,def=x==="A"?B:A,af=x==="A"?factors.A:factors.B,df=x==="A"?factors.B:factors.A;
      var ability=testAbility(atk);
      var base=(af.force*.55+af.precision*.25+af.core*.20)+(pA>pB&&x==="A"?2:pB>pA&&x==="B"?2:0);
      var mitigation=Math.max(12,df.guard*.34+df.adaptation*.12);
      var crit=Math.random()<Math.min(.28,af.precision/500);
      var dmg=Math.max(4,Math.round((base-mitigation)*(crit?1.55:1)*(0.88+Math.random()*.24)));
      if(ability==="PHASE SHIFT")dmg=Math.round(dmg*.85);
      if(ability==="REGEN MATRIX"){if(x==="A")hpA=Math.min(100,hpA+7);else hpB=Math.min(100,hpB+7);}
      if(ability==="AEGIS OVERDRIVE")dmg=Math.round(dmg*1.15);
      if(x==="A")hpB=Math.max(0,hpB-dmg);else hpA=Math.max(0,hpA-dmg);
      log.push("Round "+rounds+": "+atk.name+" used "+ability+" for "+dmg+" "+(crit?"critical ":"")+"damage. "+def.name+" at "+(x==="A"?hpB:hpA)+"%.");
    });
  }
  var win=hpA>hpB?"A":hpB>hpA?"B":"A";
  var winner=win==="A"?A:B,loser=win==="A"?B:A;
  var reasons=[];
  var pairs=[["Force",factors.A.force,factors.B.force],["Guard",factors.A.guard,factors.B.guard],["Velocity",factors.A.velocity,factors.B.velocity],["Precision",factors.A.precision,factors.B.precision],["Core Energy",factors.A.core,factors.B.core],["Recovery",factors.A.recovery,factors.B.recovery],["Adaptation",factors.A.adaptation,factors.B.adaptation]];
  pairs.forEach(function(x){if(Math.abs(x[1]-x[2])>=5)reasons.push(x[0]+" advantage: "+(x[1]>x[2]?A.name:B.name)+" ("+Math.max(x[1],x[2])+" vs "+Math.min(x[1],x[2])+")")});
  reasons.push("Overall build power: "+A.name+" "+pA+" vs "+B.name+" "+pB);
  if(A.gear.length||B.gear.length)reasons.push("Equipment was included using current gear and condition.");
  reasons.push("Ability usage and controlled battle variance affected individual exchanges.");
  return {winner:win,winnerName:winner.name,loserName:loser.name,hpA:hpA,hpB:hpB,rounds:rounds,log:log,reasons:reasons};
}
function testApplyResult(ca,cb,res,type){

  ca.battles++;cb.battles++;
  if(winA){ca.wins++;cb.losses++;ca.xp+=30;cb.xp+=10}else{cb.wins++;ca.losses++;cb.xp+=30;ca.xp+=10}
  ca.condition=Math.max(0,ca.condition-5);cb.condition=Math.max(0,cb.condition-5);
  ca.energy=Math.max(0,ca.energy-5);cb.energy=Math.max(0,cb.energy-5);
  [ca,cb].forEach(function(c){while(c.xp>=100){c.xp-=100;c.level++;c.value+=25;c.history.push("Day "+S.day+": Reached Level "+c.level)}});
  ca.history.push("Day "+S.day+": "+(winA?"Victory":"Defeat")+" in "+type+" 1v1");
  cb.history.push("Day "+S.day+": "+(winA?"Defeat":"Victory")+" in "+type+" 1v1");
}

function friendEncode(obj){

}
function friendDecode(code){
  try{var b=code.replace(/^ASC1-/,"").replace(/-/g,"");while(b.length%4)b+="=";var raw=decodeURIComponent(escape(atob(b)));return JSON.parse(raw)}catch(e){return null}
}

function ensureFullGame(){
  ensureTestState();
  if(!S.tasks)S.tasks=[null,null,null];

  if(!S.craftHistory)S.craftHistory=[];

    if(!c.equipment)c.equipment={weapon:null,armour:null,augment1:null,augment2:null,core:null};

function detailedWarriors(){
 ensureFullGame();if(!S.chars.length)return warriors();return S.chars.map(function(c){var stage=['','ORIGIN','AWAKENED','DEVELOPED','CORE EVOLVED','ASCENDED'][c.evolutionStage||stageForLevel(c.level)];return '<div class="compact-warrior" onclick="openWarriorDetails(\''+c.id+'\')"><div class="compact-head"><div class="compact-avatar">'+c.icon+'</div><div class="compact-main"><div class="compact-name">'+esc(c.origin+' '+c.name)+'</div><div class="compact-meta">'+esc(c.id)+' · '+stage+' · LV '+c.level+'</div></div><div class="compact-power">POWER<br>'+testPower(c)+'<div class="compact-arrow">›</div></div></div><div class="compact-stats">'+effectiveStats(c).slice(0,4).map(function(v,i){return '<div class="compact-stat"><span>'+STATN[i]+'</span><b>'+v+'</b></div>'}).join('')+'</div><div class="compact-footer"><span class="compact-chip">'+c.wins+'W / '+c.losses+'L</span><span class="compact-chip">⚙ '+c.condition+'%</span><span class="compact-chip">✦ '+c.abilities.length+' Abilities</span><span class="compact-chip">'+(Object.values(c.equipment||{}).filter(Boolean).length)+' Gear</span><span class="compact-chip">Tap for full details ›</span></div></div>';}).join('');}
function forgeScreen(){return forge()}
function originalScreenOverride(){switch(S.screen){case'warriors':return detailedWarriors();case'battle':return testCenter();case'actions':return actions();case'inventory':return inventory();case'market':return market();case'history':return history();case'forge':return forgeScreen();case'develop':return develop();default:return home();}}
function nextDay(){ensureFullGame();resolveTasks();S.day++;S.drops=3;S.timed=3;S.training=6;S.scavenge=5;S.practice=5;S.ranked=3;S.missions={done:false};S.chars.forEach(function(c){c.energy=Math.min(100,c.energy+25);c.condition=Math.min(100,c.condition+10);c.history.push('Day '+S.day+': Daily reset / recovery');});log('Advanced to Day '+S.day+' — daily systems refreshed');save();render();toast('DAY '+S.day+' ONLINE');}
function renderContinuous(){ensureFullGame();document.getElementById('resources').innerHTML=[['◈',S.credits],['◇',S.fragments],['⚙',S.parts],['✦',S.shards],['◆',S.prime],['⬢',S.overcore],['DAY',S.day]].map(function(x){return '<span class="res">'+x[0]+' '+x[1]+'</span>'}).join('');var tabs=[['home','HOME'],['warriors','WARRIORS'],['develop','DEVELOP'],['forge','FORGE'],['battle','BATTLE'],['actions','ACTIONS'],['inventory','INVENTORY'],['market','MARKET'],['history','CHRONICLE']];document.getElementById('nav').innerHTML=tabs.map(function(t){return '<button class="'+(S.screen===t[0]?'active':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('');document.getElementById('main').innerHTML=originalScreenOverride();}
function render(){renderContinuous();}

ensureFullGame();
render();
restorePersistentSave();
window.addEventListener("pagehide",function(){save()});
window.addEventListener("beforeunload",function(){save()});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")save()});
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('./sw.js').catch(function(){}); });
}
</script>
